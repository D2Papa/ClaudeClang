# CI: PR 머지 조건. 빌드 성공 + 소스코드 품질 기준(CLAUDE.md 2장) 전체 만족.
# 개발 환경과 같은 claudeclangbuild 이미지 안에서 scripts/ci/run_all.sh 를 실행한다.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: claudeclangbuild 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: claudeclangbuild
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 품질 게이트 (빌드, 테스트, 커버리지, Cppcheck, Lizard, 주석, Doxygen)
        run: docker run --rm -v "$PWD:/work" claudeclangbuild bash scripts/ci/run_all.sh

      - name: 리포트 권한 정리 (컨테이너가 root로 만든 파일을 업로드할 수 있게 한다)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" reports build 2>/dev/null || true

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
